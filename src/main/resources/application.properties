spring.application.name=crud

spring.datasource.url=jdbc:h2:file:./data/crud_banco
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

logging.level.org.springframework.security=DEBUG

security.password.bcrypt-strength=${BCRYPT_STRENGTH:12}

jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
security.jwt.issuer=${JWT_ISSUER:agencia-bancaria-api}
